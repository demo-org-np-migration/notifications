name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/demo-org-np-migration/notifications

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (sha tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Build and push (semver tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy-staging:
    needs: build
    runs-on: [self-hosted, cauri-k8s]
    steps:
      - uses: actions/checkout@v4

      - name: Apply staging manifests
        run: |
          sed "s/IMAGE_TAG/${{ needs.build.outputs.tag }}/" k8s/staging/*.yaml | kubectl apply -n staging -f -

  deploy-prod:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, cauri-k8s]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply prod manifests
        run: |
          sed "s/IMAGE_TAG/${{ github.ref_name }}/" k8s/prod/*.yaml | kubectl apply -n prod -f -
