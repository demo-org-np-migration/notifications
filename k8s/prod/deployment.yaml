apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: prod
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: cauri
    cauri.io/team: channels
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/part-of: cauri
        cauri.io/team: channels
    spec:
      containers:
        - name: notifications
          image: ghcr.io/demo-org-np-migration/notifications:IMAGE_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: notifications-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-notifications
                  key: client_secret
            - name: MAILGUNNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notifications-secrets
                  key: mailgunner_api_key
            - name: PUSHLY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notifications-secrets
                  key: pushly_api_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
