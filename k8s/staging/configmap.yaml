apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-config
  namespace: staging
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/part-of: cauri
    cauri.io/team: channels
data:
  SERVICE_NAME: "notifications"
  ENV: "staging"
  PORT: "8080"
  LOG_LEVEL: "info"
  DB_HOST: "postgres.staging.svc"
  DB_PORT: "5432"
  DB_NAME: "notifications"
  KEYCLOAK_ISSUER: "http://keycloak.platform.svc:8080/realms/cauri-staging"
  KEYCLOAK_CLIENT_ID: "notifications"
  AWS_ENDPOINT_URL: "http://localstack.platform.svc:4566"
  AWS_REGION: "us-east-1"
  SQS_QUEUE_PREFIX: "staging-"
  ACCOUNTS_API_URL: "http://accounts-api.staging.svc:8080"
  MAILGUNNER_URL: "http://sandbox.mailgunner.net"
  PUSHLY_URL: "http://sandbox.pushly.app"
